<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Мониторинг группы</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- ─── AUTH ─── -->
    <div id="authScreen" class="auth-screen hidden">
        <div class="auth-card">
            <div class="auth-title">Вход</div>
            <div class="auth-text">Войдите через Google, чтобы открыть монитор группы.</div>
            <button id="googleBtn" class="google-btn" type="button">Войти через Google</button>
        </div>
    </div>

    <!-- ─── APP ─── -->
    <div id="appScreen" class="app hidden">

        <!-- КАРТОЧКА СЕССИИ -->
        <div class="card">
            <div id="mainName" class="main-name">Загрузка...</div>
            <div class="big-timer">
                <span class="icon">⏱️</span>
                <span id="bigTimerText">0 сек.</span>
            </div>
            <button id="endSessionBtn" class="btn btn-danger" type="button">⛔ Завершить сессию</button>
            <div class="btn-row">
                <button id="statusMenuBtn" class="btn btn-warning" type="button">☕ Перерыв</button>
                <button id="logoutBtn" class="btn btn-secondary" type="button">Выход</button>
            </div>
        </div>

        <!-- КАРТОЧКА ПРОФИЛЯ -->
        <div class="card">
            <div class="profile-header">
                <div id="profileAvatar" class="profile-avatar">Я</div>
                <div class="profile-header-info">
                    <div class="profile-name" id="profileName">Загрузка...</div>
                    <div class="profile-online">
                        <span class="status-dot online"></span> В сети
                    </div>
                </div>
            </div>
            <div id="profileAchievements" class="profile-achievements"></div>
            <div id="profileStats" class="profile-stats"></div>
            <div class="status-grid">
                <button class="status-pill active" data-status="📚 Учусь" data-color="#28a745" type="button">
                    <span class="status-pill-dot dot-green"></span> В сети
                </button>
                <button class="status-pill" data-status="☕ Перерыв" data-color="#f4bf08" type="button">
                    <span class="status-pill-dot dot-yellow"></span> Отошёл
                </button>
                <button class="status-pill" data-status="🎮 В игре" data-color="#17a2b8" type="button">
                    <span class="status-pill-dot dot-red"></span> Занят
                </button>
                <button class="status-pill" data-status="🏠 Дома" data-color="#6c757d" type="button">
                    <span class="status-pill-dot dot-gray"></span> Не беспокоить
                </button>
            </div>
            <div class="presence-summary">
                <div class="presence-item">
                    <div id="summaryStudying" class="presence-count count-green">0</div>
                    <div class="presence-label">УЧАТСЯ</div>
                </div>
                <div class="presence-item">
                    <div id="summaryBreak" class="presence-count count-yellow">0</div>
                    <div class="presence-label">ПЕРЕРЫВ</div>
                </div>
                <div class="presence-item">
                    <div id="summaryOffline" class="presence-count count-red">0</div>
                    <div class="presence-label">ОФЛАЙН</div>
                </div>
            </div>
        </div>

        <!-- КАРТОЧКА МОНИТОРА ГРУППЫ -->
        <div class="card">
            <div class="tab-bar">
                <button class="tab-btn" data-tab-btn="participants" type="button">👥 Участники</button>
                <button class="tab-btn" data-tab-btn="leaderboard"  type="button">🏆 Рейтинг</button>
                <button class="tab-btn" data-tab-btn="achievements" type="button">🏅 Достижения</button>
            </div>
            <div data-tab-panel="participants">
                <div id="usersList" class="group-list">
                    <div class="muted">Загрузка списка...</div>
                </div>
            </div>
            <div data-tab-panel="leaderboard" class="hidden">
                <div class="section-label">ТОП СТУДЕНТОВ</div>
                <div id="leaderboardList" class="leaderboard-list">
                    <div class="muted">Загрузка рейтинга...</div>
                </div>
            </div>
            <div data-tab-panel="achievements" class="hidden">
                <div class="achievements-header">
                    <div class="section-label">ВСЕ ДОСТИЖЕНИЯ</div>
                    <div id="achievementsCount" class="achievements-count">0/14</div>
                </div>
                <div id="achievementsGrid" class="achievements-grid">
                    <div class="muted">Загрузка достижений...</div>
                </div>
            </div>
        </div>

        <!-- КАРТОЧКА ЧАТА -->
        <div class="card">
            <div class="section-title">💬 Общий чат</div>
            <div id="chatBox" class="chat-box">
                <div class="muted">Загрузка чата...</div>
            </div>
            <form id="chatForm" class="chat-form">
                <input id="chatInput" class="chat-input" type="text" placeholder="Сообщение..."
                    maxlength="500" autocomplete="off" />
                <button class="send-btn" type="submit">➤</button>
            </form>
        </div>

    </div>

    <!-- ─── STATUS MENU ─── -->
    <div id="statusMenu" class="menu-backdrop hidden">
        <div class="menu-sheet">
            <div class="menu-title">Выберите статус</div>
            <div class="menu-grid">
                <button class="status-option opt-study" data-status="📚 Учусь"            data-color="#28a745" type="button">📚 Учусь</button>
                <button class="status-option opt-break" data-status="☕ Перерыв"          data-color="#f4bf08" type="button">☕ Перерыв</button>
                <button class="status-option opt-game"  data-status="🎮 В игре"           data-color="#17a2b8" type="button">🎮 В игре</button>
                <button class="status-option opt-home"  data-status="🏠 Дома"             data-color="#6c757d" type="button">🏠 Дома</button>
                <button class="status-option opt-end"   data-status="⛔ Сессия завершена" data-color="#e53345" type="button">⛔ Завершить сессию</button>
                <button id="closeMenuBtn" class="status-option opt-close" type="button">Закрыть</button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
