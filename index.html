<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DM</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f3f4f6;margin:0;padding:16px;color:#111827;}
    .card{max-width:520px;margin:0 auto 12px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px;}
    .row{display:flex;gap:10px;align-items:center;}
    button{cursor:pointer;border:1px solid #d1d5db;background:#fff;border-radius:10px;padding:10px 12px;font-weight:500;}
    button.primary{background:#2563eb;color:#fff;border-color:#2563eb;}
    button.danger{background:#fee2e2;color:#b91c1c;border-color:#fecaca;}

    .title{font-size:16px;font-weight:600;margin:0;}
    .muted{color:#6b7280;font-size:13px;}

    /* Users */
    #users{display:flex;flex-wrap:wrap;gap:10px;}
    .user-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;cursor:pointer; width: 100%;}
    .user-item:hover{border-color:#cbd5e1;}
    .status-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
    
    /* Chat */
    #chat{height:320px;overflow:auto;border:1px solid #e5e7eb;border-radius:10px;padding:10px;background:#fafafa;}
    input{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:10px 12px;font-size:14px;}
    .send{width:44px;height:40px;border-radius:10px;border:1px solid #2563eb;background:#2563eb;color:#fff;font-weight:600;}

    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .meBlock{display:flex;align-items:center;gap:10px;min-width:0;}
  </style>
</head>
<body>

  <div id="app">
    <div class="card">
      <div class="topbar">
        <div class="meBlock">
          <div id="myInfo" class="title">Загрузка профиля...</div>
        </div>
        <button onclick="changeStatus('Работаю', '#10b981')" class="primary">Статус: Работаю</button>
      </div>
    </div>

    <div class="card">
      <div class="title" style="margin-bottom:10px;">Собеседники</div>
      <div id="users" class="muted">Загрузка списка...</div>
    </div>

    <div class="card">
      <div id="chatTitle" class="title" style="margin-bottom:10px;">Общий чат</div>
      <div id="chat"></div>
      <div class="row" style="margin-top:10px;">
        <input id="text" placeholder="Сообщение..." />
        <button id="sendBtn" class="send">▶</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    // Данные из твоего скриншота
    const URL = 'https://ugracdwltsflfwieakty.supabase.co';
    const KEY = 'sb_publishable_zXJ6w0FH5iq2DUTk2kv7BQ_2rpI4LIq';
    const supabase = createClient(URL, KEY);

    const MY_ID = 'd018d117-1ace-4230-9410-f6f6fe12d7f4';

    // Функция смены статуса
    window.changeStatus = async (text, color) => {
        const { error } = await supabase
            .from('profiles')
            .update({ status: text, color: color })
            .eq('id', MY_ID);

        if (error) {
            alert("Ошибка! Проверьте RLS политики в Supabase.");
            console.error(error);
        } else {
            fetchGroup();
        }
    };

    // Функция получения списка пользователей
    async function fetchGroup() {
        const { data, error } = await supabase
            .from('profiles')
            .select('*')
            .order('username', { ascending: true });

        if (error) return console.error(error);

        // Отрисовка списка в блок #users
        const list = document.getElementById('users');
        list.innerHTML = data.map(user => `
            <div class="user-item">
                <div class="status-dot" style="background: ${user.color || '#ccc'}"></div>
                <div style="flex-grow: 1;">
                    <strong>${user.username}</strong><br>
                    <small style="color: #666;">${user.status || 'Статус не задан'}</small>
                </div>
            </div>
        `).join('');

        // Отображение текущего пользователя в #myInfo
        const me = data.find(u => u.id === MY_ID);
        if (me) {
            document.getElementById('myInfo').innerText = `Вы зашли как: ${me.username}`;
        }
    }

    // Первый запуск
    fetchGroup();

    // Обновление каждые 5 секунд
    setInterval(fetchGroup, 5000);
  </script>
</body>
</html>
