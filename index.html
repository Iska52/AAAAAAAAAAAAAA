<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Мониторинг группы</title>
    <style>
        /* ══════════════════════════════════════
     ТОКЕНЫ
  ══════════════════════════════════════ */
        :root {
            --bg: #0f0f13;
            --surface: #17171d;
            --surface-2: #1e1e26;
            --border: #2a2a35;
            --text: #e8e8f0;
            --muted: #6b6b80;
            --faint: #3a3a4a;

            --blue: #4f8ef7;
            --green: #22c55e;
            --yellow: #f4bf08;
            --red: #e53345;
            --cyan: #17a2b8;
            --gray: #6c757d;
            --purple: #a855f7;
            --orange: #f97316;
            --gold: #eab308;

            /* редкости */
            --rarity-common: #22c55e;
            --rarity-rare: #4f8ef7;
            --rarity-epic: #a855f7;
            --rarity-legendary: #f97316;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 22px;
            --shadow: 0 8px 24px rgba(0, 0, 0, .35);
        }

        /* ══════════════════════════════════════
     BASE
  ══════════════════════════════════════ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .hidden {
            display: none !important;
        }

        /* ══════════════════════════════════════
     AUTH
  ══════════════════════════════════════ */
        .auth-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            padding: 28px 24px;
            text-align: center;
        }

        .auth-title {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .auth-text {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .google-btn {
            width: 100%;
            min-height: 46px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--surface-2);
            color: var(--text);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.15s;
        }

        .google-btn:hover {
            background: var(--faint);
        }

        /* ══════════════════════════════════════
     LAYOUT
  ══════════════════════════════════════ */
        .app {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            padding: 8px 8px 32px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            padding: 18px;
            margin-bottom: 14px;
        }

        /* ══════════════════════════════════════
     СЕССИЯ — таймер + кнопки
  ══════════════════════════════════════ */
        .main-name {
            text-align: center;
            font-size: 17px;
            font-weight: 900;
            line-height: 1.25;
            margin-bottom: 14px;
        }

        .big-timer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--blue);
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 16px;
        }

        .big-timer .icon {
            font-size: 28px;
            line-height: 1;
        }

        .btn {
            width: 100%;
            min-height: 42px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: opacity 0.15s, filter 0.15s;
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        .btn:active {
            filter: brightness(0.9);
        }

        .btn-danger {
            background: var(--red);
            color: #fff;
        }

        .btn-warning {
            background: var(--yellow);
            color: #111;
        }

        .btn-secondary {
            background: var(--faint);
            color: var(--text);
        }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        /* ══════════════════════════════════════
     ПРОФИЛЬ — шапка
  ══════════════════════════════════════ */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .profile-avatar {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: #28a745;
            color: #fff;
            font-size: 18px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            letter-spacing: -0.5px;
        }

        .profile-header-info {
            min-width: 0;
        }

        .profile-name {
            font-size: 15px;
            font-weight: 900;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-online {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: var(--green);
            font-weight: 700;
            margin-top: 3px;
        }

        /* ══════════════════════════════════════
     ПРОФИЛЬ — мини-бейджи достижений
  ══════════════════════════════════════ */
        .profile-achievements {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 14px;
        }

        .mini-achievement {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            border: 1px solid transparent;
        }

        .mini-common {
            background: rgba(34, 197, 94, .15);
            border-color: rgba(34, 197, 94, .3);
            color: var(--rarity-common);
        }

        .mini-rare {
            background: rgba(79, 142, 247, .15);
            border-color: rgba(79, 142, 247, .3);
            color: var(--rarity-rare);
        }

        .mini-epic {
            background: rgba(168, 85, 247, .15);
            border-color: rgba(168, 85, 247, .3);
            color: var(--rarity-epic);
        }

        .mini-legendary {
            background: rgba(249, 115, 22, .15);
            border-color: rgba(249, 115, 22, .3);
            color: var(--rarity-legendary);
        }

        /* ══════════════════════════════════════
     ПРОФИЛЬ — статистика 4 плитки
  ══════════════════════════════════════ */
        .profile-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 14px;
        }

        .profile-stat {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 4px;
            text-align: center;
        }

        .profile-stat-value {
            font-size: 14px;
            font-weight: 900;
            color: var(--text);
            line-height: 1.2;
        }

        .profile-stat-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.5px;
            margin-top: 3px;
            text-transform: uppercase;
        }

        /* ══════════════════════════════════════
     ПРОФИЛЬ — кнопки статусов (пилюли)
  ══════════════════════════════════════ */
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--surface-2);
            color: var(--text);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .status-pill:hover {
            background: var(--faint);
        }

        .status-pill.active {
            border-color: var(--green);
            background: rgba(34, 197, 94, .1);
            color: var(--green);
        }

        .status-pill-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .dot-green {
            background: var(--green);
        }

        .dot-yellow {
            background: var(--yellow);
        }

        .dot-red {
            background: var(--red);
        }

        .dot-gray {
            background: var(--gray);
        }

        /* ══════════════════════════════════════
     ПРОФИЛЬ — сводка присутствия
  ══════════════════════════════════════ */
        .presence-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .presence-item {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 4px;
            text-align: center;
        }

        .presence-count {
            font-size: 22px;
            font-weight: 900;
            line-height: 1.1;
        }

        .presence-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.5px;
            margin-top: 3px;
            text-transform: uppercase;
        }

        .count-green {
            color: var(--green);
        }

        .count-yellow {
            color: var(--yellow);
        }

        .count-red {
            color: var(--red);
        }

        /* ══════════════════════════════════════
     ТАБ-БАР
  ══════════════════════════════════════ */
        .tab-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 4px;
            margin-bottom: 16px;
        }

        .tab-btn {
            padding: 8px 4px;
            border: none;
            border-radius: calc(var(--radius-md) - 2px);
            background: transparent;
            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            text-align: center;
            line-height: 1.3;
        }

        .tab-btn:hover {
            color: var(--text);
            background: var(--faint);
        }

        .tab-btn.active {
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 1px 4px rgba(0, 0, 0, .4);
        }

        /* ══════════════════════════════════════
     УЧАСТНИКИ (оригинальный стиль)
  ══════════════════════════════════════ */
        .section-title {
            text-align: center;
            font-size: 15px;
            font-weight: 900;
            margin-bottom: 14px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .group-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .user-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 7px 0;
            border-bottom: 1px solid var(--border);
        }

        .user-item:last-child {
            border-bottom: none;
        }

        .user-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--faint);
            flex-shrink: 0;
        }

        .status-dot.online {
            background: var(--green);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, .18);
        }

        .user-name {
            font-size: 14px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        .user-right {
            margin-left: auto;
            text-align: right;
        }

        .user-status {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.2;
            white-space: nowrap;
        }

        .study-time {
            font-size: 11px;
            color: var(--blue);
            line-height: 1.2;
            margin-top: 2px;
            white-space: nowrap;
        }

        .online-text {
            font-size: 10px;
            color: var(--muted);
            margin-top: 2px;
            line-height: 1.2;
            white-space: nowrap;
        }

        .online-text.is-online {
            color: var(--green);
            font-weight: 700;
        }

        /* ══════════════════════════════════════
     РЕЙТИНГ
  ══════════════════════════════════════ */
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .leader-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            transition: background 0.15s;
        }

        .leader-item.top-1 {
            border-color: rgba(234, 179, 8, .4);
            background: rgba(234, 179, 8, .07);
        }

        .leader-item.top-2 {
            border-color: rgba(148, 163, 184, .4);
            background: rgba(148, 163, 184, .07);
        }

        .leader-item.top-3 {
            border-color: rgba(180, 83, 9, .4);
            background: rgba(180, 83, 9, .07);
        }

        .leader-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .leader-rank {
            font-size: 18px;
            line-height: 1;
            flex-shrink: 0;
            width: 28px;
            text-align: center;
        }

        .leader-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            letter-spacing: -0.5px;
        }

        .leader-meta {
            min-width: 0;
        }

        .leader-name {
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }

        .leader-sub {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }

        .leader-right {
            font-size: 13px;
            font-weight: 900;
            color: var(--blue);
            white-space: nowrap;
            flex-shrink: 0;
            text-align: right;
        }

        /* ══════════════════════════════════════
     ДОСТИЖЕНИЯ — сетка
  ══════════════════════════════════════ */
        .achievements-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .achievements-count {
            font-size: 12px;
            font-weight: 800;
            color: var(--muted);
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2px 10px;
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .achievement-card {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .achievement-card.unlocked {
            cursor: default;
        }

        .achievement-card.unlocked:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, .4);
        }

        .achievement-card.locked {
            opacity: 0.45;
            filter: grayscale(1);
        }

        /* цветная рамка по редкости у разблокированных */
        .achievement-card.unlocked.rarity-common {
            border-color: rgba(34, 197, 94, .4);
        }

        .achievement-card.unlocked.rarity-rare {
            border-color: rgba(79, 142, 247, .4);
        }

        .achievement-card.unlocked.rarity-epic {
            border-color: rgba(168, 85, 247, .4);
        }

        .achievement-card.unlocked.rarity-legendary {
            border-color: rgba(249, 115, 22, .5);
            background: rgba(249, 115, 22, .06);
        }

        .achievement-card-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .achievement-icon {
            font-size: 26px;
            line-height: 1;
        }

        .achievement-title {
            font-size: 13px;
            font-weight: 900;
            line-height: 1.2;
        }

        .achievement-desc {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.4;
        }

        .achievement-rarity {
            display: inline-block;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 2px 7px;
            border-radius: 20px;
            margin-top: 2px;
            align-self: flex-start;
        }

        .rarity-common .achievement-rarity {
            background: rgba(34, 197, 94, .2);
            color: var(--rarity-common);
        }

        .rarity-rare .achievement-rarity {
            background: rgba(79, 142, 247, .2);
            color: var(--rarity-rare);
        }

        .rarity-epic .achievement-rarity {
            background: rgba(168, 85, 247, .2);
            color: var(--rarity-epic);
        }

        .rarity-legendary .achievement-rarity {
            background: rgba(249, 115, 22, .2);
            color: var(--rarity-legendary);
        }

        /* ══════════════════════════════════════
     ЧАТ
  ══════════════════════════════════════ */
        .chat-box {
            min-height: 160px;
            max-height: 240px;
            overflow-y: auto;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar {
            width: 4px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: var(--faint);
            border-radius: 4px;
        }

        .chat-line {
            font-size: 13px;
            line-height: 1.45;
            margin-bottom: 7px;
            word-break: break-word;
            color: var(--text);
        }

        .chat-line strong {
            font-weight: 900;
            color: var(--blue);
        }

        .chat-form {
            display: grid;
            grid-template-columns: 1fr 46px;
            gap: 8px;
            margin-top: 10px;
        }

        .chat-input {
            width: 100%;
            height: 40px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            color: var(--text);
            padding: 0 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }

        .chat-input::placeholder {
            color: var(--muted);
        }

        .chat-input:focus {
            border-color: var(--blue);
        }

        .send-btn {
            border: none;
            border-radius: var(--radius-sm);
            background: var(--green);
            color: #fff;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            transition: filter 0.15s;
        }

        .send-btn:hover {
            filter: brightness(1.15);
        }

        .send-btn:active {
            filter: brightness(0.9);
        }

        /* ══════════════════════════════════════
     СТАТУС-МЕНЮ (bottom sheet)
  ══════════════════════════════════════ */
        .menu-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .55);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 12px;
            z-index: 50;
        }

        .menu-sheet {
            width: 100%;
            max-width: 430px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl) var(--radius-xl) var(--radius-md) var(--radius-md);
            box-shadow: 0 -8px 32px rgba(0, 0, 0, .45);
            padding: 18px;
        }

        .menu-title {
            text-align: center;
            font-size: 15px;
            font-weight: 900;
            margin-bottom: 14px;
        }

        .menu-grid {
            display: grid;
            gap: 8px;
        }

        .status-option {
            min-height: 46px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            color: #fff;
            transition: filter 0.15s;
        }

        .status-option:hover {
            filter: brightness(1.1);
        }

        .status-option:active {
            filter: brightness(0.9);
        }

        .opt-study {
            background: #28a745;
        }

        .opt-break {
            background: var(--yellow);
            color: #111;
        }

        .opt-game {
            background: var(--cyan);
        }

        .opt-home {
            background: var(--gray);
        }

        .opt-end {
            background: var(--red);
        }

        .opt-close {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        /* ══════════════════════════════════════
     УТИЛИТЫ
  ══════════════════════════════════════ */
        .muted {
            font-size: 13px;
            color: var(--muted);
            text-align: center;
            padding: 12px 0;
        }
    </style>
</head>

<body>
    <!-- ─── AUTH ─── -->

        function escapeHtml(value = '') {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function buildUsername(user) {
            return user?.user_metadata?.full_name?.trim()
                || user?.email?.split('@')[0]
                || 'Пользователь';
        }

        function getInitials(name = '') {
            const parts = String(name).trim().split(/\s+/).filter(Boolean);
            if (!parts.length) return 'П';
            return parts.slice(0, 2).map(part => part[0]?.toUpperCase()).join('');
        }

        function isOnline(lastSeen) {
            if (!lastSeen) return false;
            return Date.now() - new Date(lastSeen).getTime() < ONLINE_WINDOW_MS;
        }

        function toDurationSec(iso) {
            if (!iso) return 0;
            return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
        }

        function formatBigTimer(iso) {
            const sec = toDurationSec(iso);
            if (sec < 60) return `${sec} сек.`;
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            if (h > 0) return `${h}ч ${m}м ${s}с`;
            return `${m}м ${s}с`;
        }

        function formatStudyTime(iso) {
            const sec = toDurationSec(iso);
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            return `${h}ч ${m}м ${s}с`;
        }

        function formatSeconds(totalSec = 0) {
            const sec = Math.max(0, Number(totalSec) || 0);
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            return `${h}ч ${m}м ${s}с`;
        }

        function getLiveStudySeconds(user) {
            let total = Number(user.total_study_seconds) || 0;
            if (user.status === STUDY_STATUS && user.status_changed_at) {
                total += toDurationSec(user.status_changed_at);
            }
            return total;
        }

        function formatShortSeconds(totalSec = 0) {
            const sec = Math.max(0, Number(totalSec) || 0);
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            if (h > 0) return `${h}ч ${m}м`;
            if (m > 0) return `${m}м`;
            return `${sec}с`;
        }

        async function signInWithGoogle() {
            const redirectTo = window.location.origin + window.location.pathname;

            const { data, error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo }
            });

            if (error) {
                alert('Ошибка входа: ' + error.message);
                console.error(error);
                return;
            }

            if (data?.url) {
                window.location.href = data.url;
            }
        }

        async function signOut() {
            try {
                await supabase.auth.signOut();
            } catch (e) {
                console.error('signOut error', e);
            }

            hardLogoutUI();
            setTimeout(() => {
                window.location.href = window.location.pathname + '?logout=' + Date.now();
            }, 100);
        }

        async function getCurrentUser() {
            const { data } = await supabase.auth.getUser();
            return data?.user ?? null;

        async function ensureProfile(user) {
            const username = buildUsername(user);

            const { data: existing, error: selectError } = await supabase
                .from('profiles')
                .select(`
        id,
        username,
        status,
        color,
        last_seen,
        status_changed_at,
        total_study_seconds,
        session_count,
        message_count,
        longest_session_sec
      `)
                .eq('id', user.id)
                .maybeSingle();

            if (selectError) {
                alert('Ошибка profiles select: ' + selectError.message);
                throw selectError;
            }

            if (!existing) {
                const now = new Date().toISOString();

                const { error: insertError } = await supabase
                    .from('profiles')
                    .insert({
                        id: user.id,
                        username,
                        status: STUDY_STATUS,
                        color: '#28a745',
                        last_seen: now,
                        status_changed_at: now,
                        total_study_seconds: 0,
                        session_count: 0,
                        message_count: 0,
                        longest_session_sec: 0
                    });

                if (insertError) {
                    alert('Ошибка profiles insert: ' + insertError.message);
                    throw insertError;
                }
            } else {
                const { error: updateError } = await supabase
                    .from('profiles')
                    .update({
                        username: existing.username || username,
                        last_seen: new Date().toISOString()
                    })
                    .eq('id', user.id);

                if (updateError) {
                    alert('Ошибка profiles update: ' + updateError.message);
                    throw updateError;
                }
            }
        }

        function getMyRank() {
            if (!me || !leaderboardUsers.length) return null;
            const index = leaderboardUsers.findIndex(user => user.id === me.id);
            return index >= 0 ? index + 1 : null;
        }

        function getAchievementIdsToAward(profile, context = {}) {
            const ids = new Set();
            const totalStudy = Number(profile?.total_study_seconds) || 0;
            const sessionCount = Number(profile?.session_count) || 0;
            const messageCount = Number(profile?.message_count) || 0;
            const longestSession = Number(profile?.longest_session_sec) || 0;
            const rank = getMyRank();

            if (sessionCount >= 1) ids.add('first_step');
            if (sessionCount >= 10) ids.add('veteran');
            if (sessionCount >= 25) ids.add('unstoppable');

            if (messageCount >= 20) ids.add('activist');
            if (messageCount >= 50) ids.add('speaker');
            if (messageCount >= 100) ids.add('social_legend');

            if (totalStudy >= 10 * 3600) ids.add('dedication');
            if (totalStudy >= 20 * 3600) ids.add('legend');

            if (longestSession >= 2 * 3600) ids.add('marathon');

            if (rank && rank <= 3) ids.add('podium');
            if (rank === 1) ids.add('champion');

            if (
                context.previousStatus
                && context.previousStatus !== STUDY_STATUS
                && context.newStatus === STUDY_STATUS
            ) {
                ids.add('comeback');
            }

            if (context.newStatus === STUDY_STATUS && typeof context.startedHour === 'number') {
                if (context.startedHour < 8) ids.add('early_bird');
                if (context.startedHour >= 0 && context.startedHour < 5) ids.add('night_owl');
            }

            return [...ids].filter(id => !myAchievementIds.has(id));
        }

        async function awardAchievements(ids = []) {
            const freshIds = [...new Set(ids)].filter(id => !myAchievementIds.has(id));
            if (!freshIds.length || !me) return;

            const rows = freshIds.map(id => ({
                user_id: me.id,
                achievement_id: id
            }));

            const { error } = await supabase
                .from('user_achievements')
                .upsert(rows, {
                    onConflict: 'user_id,achievement_id',
                    ignoreDuplicates: true
                });

            if (error) {
                console.error('awardAchievements error', error);
                return;
            }

            freshIds.forEach(id => myAchievementIds.add(id));
            await fetchMyAchievements();
        }

        async function syncAchievements(context = {}) {
            if (!myProfile) return;
            const ids = getAchievementIdsToAward(myProfile, context);
            await awardAchievements(ids);

            if (!myProfile) {
                bigTimerTextEl.textContent = '0 сек.';
                statusMenuBtnEl.textContent = '☕ Перерыв';
                if (profileStatsEl) profileStatsEl.innerHTML = '';
                if (profileAchievementsEl) profileAchievementsEl.innerHTML = '';
                return;
            }

            if (myProfile.status === STUDY_STATUS) {
                bigTimerTextEl.textContent = formatBigTimer(myProfile.status_changed_at);
            } else if (myProfile.status === '☕ Перерыв') {
                bigTimerTextEl.textContent = 'Перерыв';
            } else if (myProfile.status === '🎮 В игре') {
                bigTimerTextEl.textContent = 'В игре';
            } else if (myProfile.status === '🏠 Дома') {
                bigTimerTextEl.textContent = 'Дома';
            } else if (myProfile.status === '⛔ Сессия завершена') {
                bigTimerTextEl.textContent = 'Сессия завершена';
            } else {
                bigTimerTextEl.textContent = '0 сек.';
            }

            statusMenuBtnEl.textContent = myProfile.status || '☕ Перерыв';

            if (profileStatsEl) {
                profileStatsEl.innerHTML = `
        <div class="profile-stat">
          <div class="profile-stat-value">${escapeHtml(formatShortSeconds(myProfile.total_study_seconds || 0))}</div>
          <div class="profile-stat-label">УЧЕБА</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-value">${Number(myProfile.session_count) || 0}</div>
          <div class="profile-stat-label">СЕССИЙ</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-value">${Number(myProfile.message_count) || 0}</div>
          <div class="profile-stat-label">СООБЩ.</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-value">${myAchievementIds.size}</div>
          <div class="profile-stat-label">ДОСТИЖ.</div>
        </div>
      `;
            }

            renderProfileAchievements();
        }

        function renderProfileAchievements() {
            if (!profileAchievementsEl) return;

            const unlocked = myAchievements
                .map(item => ACHIEVEMENTS_BY_ID[item.achievement_id])
                .filter(Boolean)
                .slice(0, 4);

            if (!unlocked.length) {
                profileAchievementsEl.innerHTML = '';
                return;
            }

            profileAchievementsEl.innerHTML = unlocked.map(item => `
      <div class="mini-achievement mini-${escapeHtml(item.rarity)}">
        <span>${escapeHtml(item.icon)}</span>
        <span>${escapeHtml(item.title)}</span>
      </div>
    `).join('');
        }

        function renderGroup() {
            if (!groupUsers.length) {
                usersListEl.innerHTML = '<div class="muted">Пока нет участников.</div>';
                return;
            }

            usersListEl.innerHTML = groupUsers.map(user => {
                const online = isOnline(user.last_seen);
                const studying = user.status === STUDY_STATUS;

                return `
        <div class="user-item">
          <div class="user-left">
            <div class="status-dot ${online ? 'online' : ''}"></div>
            <div class="user-name">${escapeHtml(user.username || 'Без имени')}</div>
          </div>
          <div class="user-right">
            <div class="user-status">${escapeHtml(user.status || 'Без статуса')}</div>
            ${studying ? `<div class="study-time">⏱ ${escapeHtml(formatStudyTime(user.status_changed_at))}</div>` : ''}
            <div class="online-text ${online ? 'is-online' : ''}">${online ? '● Онлайн' : '● Офлайн'}</div>
          </div>
        </div>
      `;
            }).join('');
        }

        function renderPresenceSummary() {
            if (!summaryStudyingEl || !summaryBreakEl || !summaryOfflineEl) return;

            // Считаем только онлайн-пользователей для первых двух групп,
            // офлайн — всех у кого last_seen устарел
            const studyingCount = groupUsers.filter(u =>
                isOnline(u.last_seen) && u.status === STUDY_STATUS
            ).length;

            const breakCount = groupUsers.filter(u =>
                isOnline(u.last_seen) && u.status !== STUDY_STATUS
            ).length;

            const offlineCount = groupUsers.filter(u =>
                !isOnline(u.last_seen)
            ).length;

            summaryStudyingEl.textContent = studyingCount;
            summaryBreakEl.textContent = breakCount;
            summaryOfflineEl.textContent = offlineCount;
        }

        function renderMessages() {
            if (!chatMessages.length) {
                chatBoxEl.innerHTML = '<div class="muted">Пока нет сообщений.</div>';
                return;
            }

            chatBoxEl.innerHTML = chatMessages.map(msg => `
      <div class="chat-line">
        <strong>${escapeHtml(msg.username)}:</strong> ${escapeHtml(msg.text)}
      </div>
    `).join('');

            chatBoxEl.scrollTop = chatBoxEl.scrollHeight;
        }

        function getMedalByRank(rank) {
            if (rank === 1) return '🥇';
            if (rank === 2) return '🥈';
            if (rank === 3) return '🥉';
            return `#${rank}`;
        }

        function renderLeaderboard() {
            if (!leaderboardListEl) return;

            if (!leaderboardUsers.length) {
                leaderboardListEl.innerHTML = '<div class="muted">Пока нет данных рейтинга.</div>';
                return;
            }

            // Сортируем по реальному времени (включая текущую сессию)
            const sorted = [...leaderboardUsers].sort((a, b) =>
                getLiveStudySeconds(b) - getLiveStudySeconds(a)
            );

            leaderboardListEl.innerHTML = sorted.map((user, index) => {
                const rank = index + 1;
                const medal = getMedalByRank(rank);
                const initials = getInitials(user.username || 'П');
                const liveTime = getLiveStudySeconds(user);

                return `
      <div class="leader-item ${rank <= 3 ? `top-${rank}` : ''}">
        <div class="leader-left">
          <div class="leader-rank">${escapeHtml(medal)}</div>
          <div class="leader-avatar" style="background:${escapeHtml(user.color || '#4b5563')}">${escapeHtml(initials)}</div>
          <div class="leader-meta">
            <div class="leader-name">${escapeHtml(user.username || 'Без имени')}</div>
            <div class="leader-sub">${Number(user.session_count) || 0} сессий</div>
          </div>
        </div>
        <div class="leader-right">${escapeHtml(formatSeconds(liveTime))}</div>
      </div>
    `;
            }).join('');
        }

        function renderAchievements() {
            if (achievementsCountEl) {
                achievementsCountEl.textContent = `${myAchievementIds.size}/${ACHIEVEMENTS.length}`;
            }

            if (!achievementsGridEl) return;

            achievementsGridEl.innerHTML = ACHIEVEMENTS.map(item => {
                const unlocked = myAchievementIds.has(item.id);

                return `
        <div class="achievement-card ${unlocked ? 'unlocked' : 'locked'} rarity-${escapeHtml(item.rarity)}">
          <div class="achievement-card-head">
            <div class="achievement-icon">${unlocked ? escapeHtml(item.icon) : '🔒'}</div>
            ${!unlocked ? '<div class="achievement-lock">🔒</div>' : ''}
          </div>
          <div class="achievement-title">${escapeHtml(item.title)}</div>
          <div class="achievement-desc">${escapeHtml(item.description)}</div>
          <div class="achievement-rarity">${escapeHtml(item.rarityLabel)}</div>
        </div>
      `;
            }).join('');
        }

        function switchTab(tabName) {
            activeTab = tabName;

            document.querySelectorAll('[data-tab-btn]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tabBtn === tabName);
            });

            document.querySelectorAll('[data-tab-panel]').forEach(panel => {
                panel.classList.toggle('hidden', panel.dataset.tabPanel !== tabName);
            });
        }

        async function incrementMyMessageCount() {
            if (!me || !myProfile) return;

            const nextCount = (Number(myProfile.message_count) || 0) + 1;

            const { error } = await supabase
                .from('profiles')
                .update({
                    message_count: nextCount,
                    last_seen: new Date().toISOString()
                })
                .eq('id', me.id);

            if (error) {
                console.error('incrementMyMessageCount error', error);
                return;
            }

            myProfile.message_count = nextCount;
            renderMe();
        }

        async function sendMessage(text) {
            const clean = text.trim();
            if (!clean || !me || !myProfile) return;

            const { error } = await supabase
                .from('messages')
                .insert({
                    user_id: me.id,
                    username: myProfile.username || buildUsername(me),
                    text: clean
                });

            if (error) {
                alert('Ошибка отправки сообщения: ' + error.message);
                console.error(error);
                return;
            }

            chatInputEl.value = '';

            await incrementMyMessageCount();
            await fetchMessages();
            await fetchLeaderboard();
            await syncAchievements();
        }

        async function setStatus(status, color) {
            if (!me || !myProfile) return;

            const nowIso = new Date().toISOString();
            const previousStatus = myProfile.status;
            const startedHour = new Date().getHours();
            const updatePayload = {
                status,
                color,
                last_seen: nowIso,
                status_changed_at: nowIso
            };

            if (previousStatus === STUDY_STATUS && status !== STUDY_STATUS) {
                const currentSessionSec = toDurationSec(myProfile.status_changed_at);
                updatePayload.total_study_seconds = (Number(myProfile.total_study_seconds) || 0) + currentSessionSec;
                updatePayload.session_count = (Number(myProfile.session_count) || 0) + 1;
                updatePayload.longest_session_sec = Math.max(
                    Number(myProfile.longest_session_sec) || 0,
                    currentSessionSec
                );
            }

            const { error } = await supabase
                .from('profiles')
                .update(updatePayload)
                .eq('id', me.id);

            if (error) {
                alert('Ошибка обновления статуса: ' + error.message);
                console.error(error);
                return;
            }

            closeMenu();

            await fetchMyProfile();
            await fetchGroup();
            await fetchLeaderboard();
            await syncAchievements({
                previousStatus,
                newStatus: status,
                startedHour
            });
        }

        async function endSession() {
            await setStatus('⛔ Сессия завершена', '#e53345');
        }

        async function heartbeat() {
            if (!me) return;

            await supabase
                .from('profiles')
                .update({ last_seen: new Date().toISOString() })
                .eq('id', me.id);
        }

        function tick() {
            if (myProfile?.status === STUDY_STATUS) {
                bigTimerTextEl.textContent = formatBigTimer(myProfile.status_changed_at);
            }
            renderGroup();

            // Обновляем рейтинг каждую секунду (только DOM, без запроса к БД)
            if (activeTab === 'leaderboard') {
                renderLeaderboard();
            }
        }

        googleBtn.addEventListener('click', signInWithGoogle);
        logoutBtnEl.addEventListener('click', signOut);
        endSessionBtnEl.addEventListener('click', endSession);
        statusMenuBtnEl.addEventListener('click', openMenu);
        closeMenuBtn.addEventListener('click', closeMenu);

        statusMenuEl.addEventListener('click', (e) => {
            if (e.target === statusMenuEl) closeMenu();
        });

        document.addEventListener('click', (e) => {
            const tabBtn = e.target.closest('[data-tab-btn]');
            if (tabBtn) {
                switchTab(tabBtn.dataset.tabBtn);
            }
        });

        document.querySelectorAll('.status-option[data-status]').forEach(btn => {
            btn.addEventListener('click', async () => {
                await setStatus(btn.dataset.status, btn.dataset.color);
            });
        });

        chatFormEl.addEventListener('submit', async (e) => {
            e.preventDefault();
            await sendMessage(chatInputEl.value);
        });

        async function init() {
            try {
                me = await getCurrentUser();

                if (!me) {
                    setView('auth');
                    return;
                }

                setView('app');

                await ensureProfile(me);
                await fetchMyProfile();
                await fetchGroup();
                await fetchMessages();
                await fetchLeaderboard();
                await fetchMyAchievements();
                await syncAchievements();
                await heartbeat();

                switchTab(activeTab);

                setInterval(heartbeat, 20000);
                setInterval(fetchGroup, 5000);
                setInterval(fetchMessages, 5000);
                setInterval(fetchLeaderboard, 5000);
                setInterval(tick, 1000);
            } catch (e) {
                console.error('INIT ERROR', e);
                alert('Ошибка инициализации: ' + (e?.message || 'unknown'));
            }
        }

        init();
    </script>
</body>

</html>
