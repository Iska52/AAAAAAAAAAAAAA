<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Мониторинг группы</title>
  <style>
    :root{
      --bg:#ececec;
      --card:#f3f3f3;
      --border:#e4e4e4;
      --text:#1d1d1f;
      --muted:#7f8b97;
      --blue:#3b82f6;
      --danger:#e33445;
      --warning:#f5bf08;
      --secondary:#808b97;
      --green:#22c55e;
      --graydot:#cfcfcf;
      --shadow:0 10px 25px rgba(0,0,0,.05);
      --radius:20px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:#e9e9ea;
      font-family:system-ui,-apple-system,sans-serif;
      color:var(--text);
      display:flex;
      justify-content:center;
      padding:8px;
    }

    .phone{
      width:100%;
      max-width:430px;
      background:#efefef;
      min-height:100vh;
      border:1px solid #d4d4d4;
      padding:14px 12px 24px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:22px;
      box-shadow:var(--shadow);
      padding:18px;
      margin-bottom:18px;
    }

    .main-name{
      text-align:center;
      font-size:18px;
      font-weight:800;
      line-height:1.25;
      margin-top:12px;
      margin-bottom:18px;
    }

    .big-timer{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      color:var(--blue);
      font-size:24px;
      font-weight:900;
      margin-bottom:18px;
    }

    .big-timer .icon{
      font-size:28px;
      line-height:1;
    }

    .btn{
      width:100%;
      border:none;
      border-radius:11px;
      min-height:40px;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
      transition:.18s ease;
    }

    .btn:active{transform:translateY(1px)}
    .btn-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:8px;
    }

    .btn-danger{background:var(--danger);color:#fff}
    .btn-warning{background:var(--warning);color:#222}
    .btn-secondary{background:var(--secondary);color:#fff}

    .section-title{
      text-align:center;
      font-weight:900;
      font-size:15px;
      margin-bottom:14px;
    }

    .group-list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .user-item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:8px 0;
      border-bottom:1px solid #e7e7e7;
    }

    .user-left{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:50%;
      flex:0 0 10px;
      background:var(--graydot);
    }

    .dot.online{
      background:var(--green);
      box-shadow:0 0 0 4px rgba(34,197,94,.15);
    }

    .user-name{
      font-size:15px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:150px;
    }

    .user-right{
      text-align:right;
      margin-left:auto;
    }

    .user-status{
      font-size:13px;
      color:#7b6b64;
      line-height:1.2;
      white-space:nowrap;
    }

    .user-online{
      font-size:11px;
      line-height:1.2;
      margin-top:2px;
      color:var(--muted);
    }

    .user-online.is-online{
      color:var(--green);
      font-weight:700;
    }

    .user-study-time{
      font-size:12px;
      color:#6da9ff;
      margin-top:2px;
      white-space:nowrap;
    }

    .chat-box{
      height:160px;
      overflow:auto;
      background:#f1f1f1;
      border:1px solid #e0e0e0;
      border-radius:10px;
      padding:12px;
      font-size:14px;
      line-height:1.45;
    }

    .chat-line{margin-bottom:8px; word-break:break-word}
    .chat-line strong{font-weight:900}

    .chat-form{
      display:grid;
      grid-template-columns:1fr 52px;
      gap:8px;
      margin-top:12px;
    }

    .chat-input{
      width:100%;
      height:38px;
      border:1px solid #d8d8d8;
      border-radius:10px;
      padding:0 12px;
      outline:none;
      background:#f8f8f8;
    }

    .chat-input:focus{
      border-color:#91c4ff;
      box-shadow:0 0 0 3px rgba(59,130,246,.12);
    }

    .send-btn{
      border:none;
      border-radius:10px;
      background:#43d18e;
      color:#fff;
      font-size:20px;
      font-weight:900;
      cursor:pointer;
    }

    .muted{
      color:var(--muted);
      font-size:13px;
      text-align:center;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="card">
      <div id="mainName" class="main-name">Загрузка...</div>
      <div id="bigTimer" class="big-timer">
        <span class="icon">⏱️</span>
        <span id="bigTimerText">0 сек.</span>
      </div>

      <button id="endSessionBtn" class="btn btn-danger">⛔ Завершить сессию</button>

      <div class="btn-row">
        <button id="breakBtn" class="btn btn-warning">☕ Перерыв</button>
        <button id="logoutBtn" class="btn btn-secondary">Выход</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">🎥 Монитор группы</div>
      <div id="usersList" class="group-list">
        <div class="muted">Загрузка списка...</div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">💬 Общий чат</div>
      <div id="chatBox" class="chat-box"></div>

      <form id="chatForm" class="chat-form">
        <input id="chatInput" class="chat-input" placeholder="Сообщение..." maxlength="500" />
        <button class="send-btn" type="submit">➤</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'PASTE_YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'PASTE_YOUR_SUPABASE_ANON_KEY';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const ONLINE_WINDOW_MS = 45000;
    const HEARTBEAT_MS = 20000;
    const POLL_MS = 5000;
    const CHAT_LIMIT = 100;

    const mainNameEl = document.getElementById('mainName');
    const bigTimerTextEl = document.getElementById('bigTimerText');
    const usersListEl = document.getElementById('usersList');
    const chatBoxEl = document.getElementById('chatBox');
    const chatFormEl = document.getElementById('chatForm');
    const chatInputEl = document.getElementById('chatInput');
    const breakBtnEl = document.getElementById('breakBtn');
    const logoutBtnEl = document.getElementById('logoutBtn');
    const endSessionBtnEl = document.getElementById('endSessionBtn');

    let me = null;
    let myProfile = null;
    let groupUsers = [];
    let chatMessages = [];

    function escapeHtml(value = '') {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function formatShortDuration(iso) {
      if (!iso) return '0 сек.';
      const sec = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
      if (sec < 60) return `${sec} сек.`;
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (h > 0) return `${h}ч ${m}м ${s}с`;
      return `${m}м ${s}с`;
    }

    function formatStudySmall(iso) {
      if (!iso) return '0ч 0м 0с';
      const sec = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${h}ч ${m}м ${s}с`;
    }

    function isOnline(lastSeen) {
      if (!lastSeen) return false;
      return (Date.now() - new Date(lastSeen).getTime()) < ONLINE_WINDOW_MS;
    }

    function buildUsername(user) {
      return user?.user_metadata?.full_name?.trim()
        || user?.email?.split('@')[0]
        || 'Пользователь';
    }

    async function signInWithGoogle() {
      await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin + window.location.pathname
        }
      });
    }

    async function getCurrentUser() {
      const { data, error } = await supabase.auth.getUser();
      if (error) {
        console.error('getUser error', error);
        return null;
      }
      return data.user ?? null;
    }

    async function ensureProfile(user) {
      const username = buildUsername(user);

      const { data: existing, error: selectError } = await supabase
        .from('profiles')
        .select('id, username, status, color, last_seen, status_changed_at')
        .eq('id', user.id)
        .maybeSingle();

      if (selectError) {
        console.error('ensureProfile select error', selectError);
      }

      if (!existing) {
        const payload = {
          id: user.id,
          email: user.email ?? null,
          username,
          status: '📚 Учусь',
          color: '#28a745',
          last_seen: new Date().toISOString(),
          status_changed_at: new Date().toISOString()
        };

        const { error: insertError } = await supabase.from('profiles').insert(payload);
        if (insertError) console.error('ensureProfile insert error', insertError);
      } else {
        const updates = {
          username: existing.username || username,
          email: user.email ?? null,
          last_seen: new Date().toISOString()
        };

        const { error: updateError } = await supabase
          .from('profiles')
          .update(updates)
          .eq('id', user.id);

        if (updateError) console.error('ensureProfile update error', updateError);
      }
    }

    async function fetchMyProfile() {
      if (!me) return;
      const { data, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', me.id)
        .maybeSingle();

      if (error) {
        console.error('fetchMyProfile error', error);
        return;
      }

      myProfile = data;
      renderMe();
    }

    function renderMe() {
      const displayName = myProfile?.username || buildUsername(me);
      mainNameEl.textContent = displayName;

      if (!myProfile) {
        bigTimerTextEl.textContent = '0 сек.';
        breakBtnEl.textContent = '☕ Перерыв';
        return;
      }

      if (myProfile.status === '📚 Учусь') {
        bigTimerTextEl.textContent = formatShortDuration(myProfile.status_changed_at);
        breakBtnEl.textContent = '☕ Перерыв';
      } else if (myProfile.status === '☕ Перерыв') {
        bigTimerTextEl.textContent = 'Перерыв';
        breakBtnEl.textContent = '📚 Продолжить';
      } else {
        bigTimerTextEl.textContent = 'Сессия завершена';
        breakBtnEl.textContent = '📚 Начать заново';
      }
    }

    async function fetchGroup() {
      const { data, error } = await supabase
        .from('profiles')
        .select('id, username, status, color, last_seen, status_changed_at')
        .order('username', { ascending: true });

      if (error) {
        console.error('fetchGroup error', error);
        usersListEl.innerHTML = '<div class="muted">Не удалось загрузить группу.</div>';
        return;
      }

      groupUsers = data || [];
      renderGroup();
    }

    function renderGroup() {
      if (!groupUsers.length) {
        usersListEl.innerHTML = '<div class="muted">Пока нет участников.</div>';
        return;
      }

      usersListEl.innerHTML = groupUsers.map(user => {
        const online = isOnline(user.last_seen);
        const studying = user.status === '📚 Учусь';
        const dotClass = online ? 'dot online' : 'dot';
        const statusText = escapeHtml(user.status || 'Без статуса');
        const onlineText = online
          ? '<div class="user-online is-online">● онлайн</div>'
          : '<div class="user-online">● офлайн</div>';
        const studyTime = studying
          ? `<div class="user-study-time">⏱ ${escapeHtml(formatStudySmall(user.status_changed_at))}</div>`
          : '';

        return `
          <div class="user-item">
            <div class="user-left">
              <div class="${dotClass}"></div>
              <div class="user-name">${escapeHtml(user.username || 'Без имени')}</div>
            </div>

            <div class="user-right">
              <div class="user-status">${statusText}</div>
              ${studyTime}
              ${onlineText}
            </div>
          </div>
        `;
      }).join('');
    }

    async function fetchMessages() {
      const { data, error } = await supabase
        .from('messages')
        .select('id, username, text, created_at')
        .order('created_at', { ascending: true })
        .limit(CHAT_LIMIT);

      if (error) {
        console.error('fetchMessages error', error);
        chatBoxEl.innerHTML = '<div class="muted">Чат не загрузился.</div>';
        return;
      }

      chatMessages = data || [];
      renderMessages();
    }

    function renderMessages() {
      if (!chatMessages.length) {
        chatBoxEl.innerHTML = '<div class="muted">Пока нет сообщений.</div>';
        return;
      }

      chatBoxEl.innerHTML = chatMessages.map(msg => `
        <div class="chat-line">
          <strong>${escapeHtml(msg.username)}:</strong> ${escapeHtml(msg.text)}
        </div>
      `).join('');

      chatBoxEl.scrollTop = chatBoxEl.scrollHeight;
    }

    async function sendMessage(text) {
      if (!me || !myProfile) return;
      const clean = text.trim();
      if (!clean) return;

      const { error } = await supabase.from('messages').insert({
        user_id: me.id,
        username: myProfile.username || buildUsername(me),
        text: clean
      });

      if (error) {
        console.error('sendMessage error', error);
        alert('Не удалось отправить сообщение');
        return;
      }

      chatInputEl.value = '';
      await fetchMessages();
    }

    async function setStatus(status, color) {
      if (!me) return;

      const { error } = await supabase
        .from('profiles')
        .update({
          status,
          color,
          status_changed_at: new Date().toISOString(),
          last_seen: new Date().toISOString()
        })
        .eq('id', me.id);

      if (error) {
        console.error('setStatus error', error);
        alert('Не удалось обновить статус');
        return;
      }

      await fetchMyProfile();
      await fetchGroup();
    }

    async function toggleBreak() {
      if (!myProfile) return;

      if (myProfile.status === '☕ Перерыв') {
        await setStatus('📚 Учусь', '#28a745');
      } else {
        await setStatus('☕ Перерыв', '#f5bf08');
      }
    }

    async function endSession() {
      await setStatus('⛔ Сессия завершена', '#e33445');
    }

    async function heartbeat() {
      if (!me) return;

      const { error } = await supabase
        .from('profiles')
        .update({ last_seen: new Date().toISOString() })
        .eq('id', me.id);

      if (error) console.error('heartbeat error', error);
    }

    async function logout() {
      await supabase.auth.signOut({ scope: 'local' });
      location.reload();
    }

    function startRealtime() {
      supabase.channel('watch-profiles')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, async () => {
          await fetchMyProfile();
          await fetchGroup();
        })
        .subscribe();

      supabase.channel('watch-messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, async () => {
          await fetchMessages();
        })
        .subscribe();
    }

    function tick() {
      renderMe();
      renderGroup();
    }

    chatFormEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      await sendMessage(chatInputEl.value);
    });

    breakBtnEl.addEventListener('click', toggleBreak);
    endSessionBtnEl.addEventListener('click', endSession);
    logoutBtnEl.addEventListener('click', logout);

    supabase.auth.onAuthStateChange(async () => {
      me = await getCurrentUser();
      if (me) {
        await ensureProfile(me);
        await fetchMyProfile();
        await fetchGroup();
        await fetchMessages();
      }
    });

    async function init() {
      me = await getCurrentUser();

      if (!me) {
        await signInWithGoogle();
        return;
      }

      await ensureProfile(me);
      await fetchMyProfile();
      await fetchGroup();
      await fetchMessages();

      startRealtime();
      setInterval(heartbeat, HEARTBEAT_MS);
      setInterval(fetchGroup, POLL_MS);
      setInterval(fetchMessages, POLL_MS);
      setInterval(tick, 1000);

      await heartbeat();
    }

    init();
  </script>
</body>
</html>
