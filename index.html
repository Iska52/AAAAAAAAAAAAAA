<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Мониторинг группы</title>
  <style>
    :root{
      --bg:#ececec;
      --card:#f3f3f3;
      --border:#dfdfdf;
      --text:#1f1f1f;
      --muted:#97a0aa;
      --blue:#4285f4;
      --danger:#e53345;
      --warning:#f4bf08;
      --secondary:#8b94a0;
      --green:#47d58f;
      --online:#22c55e;
      --shadow:0 10px 24px rgba(0,0,0,.05);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      font-family:system-ui,-apple-system,sans-serif;
      color:var(--text);
    }

    .hidden{display:none !important}

    .auth-screen{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .auth-card{
      width:100%;
      max-width:420px;
      background:#f5f5f5;
      border:1px solid var(--border);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:24px;
      text-align:center;
    }

    .auth-title{
      font-size:24px;
      font-weight:900;
      margin-bottom:10px;
    }

    .auth-text{
      font-size:14px;
      line-height:1.5;
      color:#6f7883;
      margin-bottom:18px;
    }

    .google-btn{
      width:100%;
      min-height:46px;
      border:none;
      border-radius:12px;
      background:#fff;
      border:1px solid #d7d7d7;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
    }

    .app{
      width:100%;
      max-width:430px;
      margin:0 auto;
      padding:8px 8px 24px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:22px;
      box-shadow:var(--shadow);
      padding:18px;
      margin-bottom:18px;
    }

    .main-name{
      text-align:center;
      font-size:18px;
      font-weight:900;
      line-height:1.25;
      margin-top:10px;
      margin-bottom:18px;
    }

    .big-timer{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      color:var(--blue);
      font-size:22px;
      font-weight:900;
      margin-bottom:18px;
    }

    .big-timer .icon{
      font-size:30px;
      line-height:1;
    }

    .btn{
      width:100%;
      min-height:40px;
      border:none;
      border-radius:11px;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
    }

    .btn-danger{background:var(--danger);color:#fff}
    .btn-warning{background:var(--warning);color:#222}
    .btn-secondary{background:var(--secondary);color:#fff}

    .btn-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:8px;
    }

    .section-title{
      text-align:center;
      font-size:15px;
      font-weight:900;
      margin-bottom:14px;
    }

    .group-list{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .user-item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:7px 0;
      border-bottom:1px solid #e7e7e7;
    }

    .user-item:last-child{border-bottom:none}

    .user-left{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
    }

    .status-dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:#d2d2d2;
      flex:0 0 10px;
    }

    .status-dot.online{
      background:var(--online);
      box-shadow:0 0 0 4px rgba(34,197,94,.12);
    }

    .user-name{
      font-size:15px;
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:150px;
    }

    .user-right{
      margin-left:auto;
      text-align:right;
    }

    .user-status{
      font-size:13px;
      color:#7c7067;
      line-height:1.2;
      white-space:nowrap;
    }

    .study-time{
      font-size:12px;
      color:#7ba8ff;
      margin-top:2px;
      line-height:1.2;
      white-space:nowrap;
    }

    .online-text{
      font-size:11px;
      color:#9aa3af;
      margin-top:2px;
      line-height:1.2;
      white-space:nowrap;
    }

    .online-text.is-online{
      color:var(--online);
      font-weight:700;
    }

    .chat-box{
      min-height:160px;
      max-height:240px;
      overflow:auto;
      background:#efefef;
      border:1px solid #dcdcdc;
      border-radius:12px;
      padding:12px;
    }

    .chat-line{
      font-size:14px;
      line-height:1.45;
      margin-bottom:8px;
      word-break:break-word;
    }

    .chat-line strong{font-weight:900}

    .chat-form{
      display:grid;
      grid-template-columns:1fr 54px;
      gap:8px;
      margin-top:12px;
    }

    .chat-input{
      width:100%;
      height:38px;
      border:1px solid #d3d3d3;
      border-radius:10px;
      background:#f7f7f7;
      padding:0 12px;
      font-size:14px;
      outline:none;
    }

    .send-btn{
      border:none;
      border-radius:10px;
      background:var(--green);
      color:#fff;
      font-size:20px;
      font-weight:900;
      cursor:pointer;
    }

    .muted{
      font-size:13px;
      color:#96a0aa;
      text-align:center;
    }

    .menu-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.18);
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding:12px;
      z-index:50;
    }

    .menu-sheet{
      width:100%;
      max-width:430px;
      background:#f5f5f5;
      border-radius:22px 22px 14px 14px;
      box-shadow:0 18px 40px rgba(0,0,0,.18);
      padding:16px;
    }

    .menu-title{
      text-align:center;
      font-size:16px;
      font-weight:900;
      margin-bottom:12px;
    }

    .menu-grid{
      display:grid;
      gap:8px;
    }

    .status-option{
      min-height:44px;
      border:none;
      border-radius:12px;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
      color:#fff;
    }

    .opt-study{background:#28a745}
    .opt-break{background:#f4bf08;color:#222}
    .opt-game{background:#17a2b8}
    .opt-home{background:#6c757d}
    .opt-end{background:#e53345}
    .opt-close{background:#fff;color:#444;border:1px solid #ddd}
  </style>
</head>
<body>
  <div id="authScreen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-title">Вход</div>
      <div class="auth-text">Войдите через Google, чтобы открыть монитор группы.</div>
      <button id="googleBtn" class="google-btn" type="button">Войти через Google</button>
    </div>
  </div>

  <div id="appScreen" class="app hidden">
    <div class="card">
      <div id="mainName" class="main-name">Загрузка...</div>

      <div class="big-timer">
        <span class="icon">⏱️</span>
        <span id="bigTimerText">0 сек.</span>
      </div>

      <button id="endSessionBtn" class="btn btn-danger" type="button">⛔ Завершить сессию</button>

      <div class="btn-row">
        <button id="statusMenuBtn" class="btn btn-warning" type="button">☕ Перерыв</button>
        <button id="logoutBtn" class="btn btn-secondary" type="button">Выход</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">🎥 Монитор группы</div>
      <div id="usersList" class="group-list"><div class="muted">Загрузка списка...</div></div>
    </div>

    <div class="card">
      <div class="section-title">💬 Общий чат</div>
      <div id="chatBox" class="chat-box"><div class="muted">Загрузка чата...</div></div>

      <form id="chatForm" class="chat-form">
        <input id="chatInput" class="chat-input" type="text" placeholder="Сообщение..." maxlength="500" />
        <button class="send-btn" type="submit">➤</button>
      </form>
    </div>
  </div>

  <div id="statusMenu" class="menu-backdrop hidden">
    <div class="menu-sheet">
      <div class="menu-title">Выберите статус</div>
      <div class="menu-grid">
        <button class="status-option opt-study" data-status="📚 Учусь" data-color="#28a745" type="button">📚 Учусь</button>
        <button class="status-option opt-break" data-status="☕ Перерыв" data-color="#f4bf08" type="button">☕ Перерыв</button>
        <button class="status-option opt-game" data-status="🎮 В игре" data-color="#17a2b8" type="button">🎮 В игре</button>
        <button class="status-option opt-home" data-status="🏠 Дома" data-color="#6c757d" type="button">🏠 Дома</button>
        <button class="status-option opt-end" data-status="⛔ Сессия завершена" data-color="#e53345" type="button">⛔ Завершить сессию</button>
        <button id="closeMenuBtn" class="status-option opt-close" type="button">Закрыть</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://ugracdwltsflfwieakty.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_zXJ6w0FH5iq2DUTk2kv7BQ_2rpI4LIq';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const ONLINE_WINDOW_MS = 45000;

    const authScreen = document.getElementById('authScreen');
    const appScreen = document.getElementById('appScreen');
    const googleBtn = document.getElementById('googleBtn');

    const mainNameEl = document.getElementById('mainName');
    const bigTimerTextEl = document.getElementById('bigTimerText');
    const usersListEl = document.getElementById('usersList');
    const chatBoxEl = document.getElementById('chatBox');
    const chatFormEl = document.getElementById('chatForm');
    const chatInputEl = document.getElementById('chatInput');

    const statusMenuBtnEl = document.getElementById('statusMenuBtn');
    const endSessionBtnEl = document.getElementById('endSessionBtn');
    const logoutBtnEl = document.getElementById('logoutBtn');

    const statusMenuEl = document.getElementById('statusMenu');
    const closeMenuBtn = document.getElementById('closeMenuBtn');

    let me = null;
    let myProfile = null;
    let groupUsers = [];
    let chatMessages = [];

    function escapeHtml(value = '') {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function buildUsername(user) {
      return user?.user_metadata?.full_name?.trim()
        || user?.email?.split('@')[0]
        || 'Пользователь';
    }

    function isOnline(lastSeen) {
      if (!lastSeen) return false;
      return Date.now() - new Date(lastSeen).getTime() < ONLINE_WINDOW_MS;
    }

    function formatBigTimer(iso) {
      if (!iso) return '0 сек.';
      const sec = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
      if (sec < 60) return `${sec} сек.`;
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (h > 0) return `${h}ч ${m}м ${s}с`;
      return `${m}м ${s}с`;
    }

    function formatStudyTime(iso) {
      if (!iso) return '0ч 0м 0с';
      const sec = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${h}ч ${m}м ${s}с`;
    }

    function setView(view) {
      authScreen.classList.add('hidden');
      appScreen.classList.add('hidden');

      if (view === 'auth') authScreen.classList.remove('hidden');
      if (view === 'app') appScreen.classList.remove('hidden');
    }

    function openMenu() {
      statusMenuEl.classList.remove('hidden');
    }

    function closeMenu() {
      statusMenuEl.classList.add('hidden');
    }

    function hardLogoutUI() {
      me = null;
      myProfile = null;
      groupUsers = [];
      chatMessages = [];
      setView('auth');
      mainNameEl.textContent = 'Загрузка...';
      bigTimerTextEl.textContent = '0 сек.';
      usersListEl.innerHTML = '<div class="muted">Загрузка списка...</div>';
      chatBoxEl.innerHTML = '<div class="muted">Загрузка чата...</div>';
    }

    async function signInWithGoogle() {
      const redirectTo = window.location.origin + window.location.pathname;

      const { data, error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo }
      });

      if (error) {
        alert('Ошибка входа: ' + error.message);
        console.error(error);
        return;
      }

      if (data?.url) {
        window.location.href = data.url;
      }
    }

    async function signOut() {
      try {
        await supabase.auth.signOut();
      } catch (e) {
        console.error('signOut error', e);
      }

      hardLogoutUI();
      setTimeout(() => {
        window.location.href = window.location.pathname + '?logout=' + Date.now();
      }, 100);
    }

    async function getCurrentUser() {
      const { data } = await supabase.auth.getUser();
      return data?.user ?? null;
    }

    async function ensureProfile(user) {
      const username = buildUsername(user);

      const { data: existing, error: selectError } = await supabase
        .from('profiles')
        .select('id, username, status, color, last_seen, status_changed_at')
        .eq('id', user.id)
        .maybeSingle();

      if (selectError) {
        alert('Ошибка profiles select: ' + selectError.message);
        throw selectError;
      }

      if (!existing) {
        const { error: insertError } = await supabase
          .from('profiles')
          .insert({
            id: user.id,
            username,
            status: '📚 Учусь',
            color: '#28a745',
            last_seen: new Date().toISOString(),
            status_changed_at: new Date().toISOString()
          });

        if (insertError) {
          alert('Ошибка profiles insert: ' + insertError.message);
          throw insertError;
        }
      } else {
        const { error: updateError } = await supabase
          .from('profiles')
          .update({
            username: existing.username || username,
            last_seen: new Date().toISOString()
          })
          .eq('id', user.id);

        if (updateError) {
          alert('Ошибка profiles update: ' + updateError.message);
          throw updateError;
        }
      }
    }

    async function fetchMyProfile() {
      if (!me) return;

      const { data, error } = await supabase
        .from('profiles')
        .select('id, username, status, color, last_seen, status_changed_at')
        .eq('id', me.id)
        .maybeSingle();

      if (error) {
        alert('Ошибка загрузки моего профиля: ' + error.message);
        console.error(error);
        return;
      }

      myProfile = data;
      renderMe();
    }

    function renderMe() {
      mainNameEl.textContent = myProfile?.username || buildUsername(me) || 'Пользователь';

      if (!myProfile) {
        bigTimerTextEl.textContent = '0 сек.';
        statusMenuBtnEl.textContent = '☕ Перерыв';
        return;
      }

      if (myProfile.status === '📚 Учусь') {
        bigTimerTextEl.textContent = formatBigTimer(myProfile.status_changed_at);
      } else if (myProfile.status === '☕ Перерыв') {
        bigTimerTextEl.textContent = 'Перерыв';
      } else if (myProfile.status === '🎮 В игре') {
        bigTimerTextEl.textContent = 'В игре';
      } else if (myProfile.status === '🏠 Дома') {
        bigTimerTextEl.textContent = 'Дома';
      } else if (myProfile.status === '⛔ Сессия завершена') {
        bigTimerTextEl.textContent = 'Сессия завершена';
      } else {
        bigTimerTextEl.textContent = '0 сек.';
      }

      statusMenuBtnEl.textContent = myProfile.status || '☕ Перерыв';
    }

    async function fetchGroup() {
      const { data, error } = await supabase
        .from('profiles')
        .select('id, username, status, color, last_seen, status_changed_at')
        .order('username', { ascending: true });

      if (error) {
        usersListEl.innerHTML = '<div class="muted">Ошибка загрузки списка</div>';
        console.error(error);
        return;
      }

      groupUsers = data || [];
      renderGroup();
    }

    function renderGroup() {
      if (!groupUsers.length) {
        usersListEl.innerHTML = '<div class="muted">Пока нет участников.</div>';
        return;
      }

      usersListEl.innerHTML = groupUsers.map(user => {
        const online = isOnline(user.last_seen);
        const studying = user.status === '📚 Учусь';

        return `
          <div class="user-item">
            <div class="user-left">
              <div class="status-dot ${online ? 'online' : ''}"></div>
              <div class="user-name">${escapeHtml(user.username || 'Без имени')}</div>
            </div>
            <div class="user-right">
              <div class="user-status">${escapeHtml(user.status || 'Без статуса')}</div>
              ${studying ? `<div class="study-time">⏱ ${escapeHtml(formatStudyTime(user.status_changed_at))}</div>` : ''}
              <div class="online-text ${online ? 'is-online' : ''}">${online ? '● Онлайн' : '● Офлайн'}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function fetchMessages() {
      const { data, error } = await supabase
        .from('messages')
        .select('id, username, text, created_at')
        .order('created_at', { ascending: true })
        .limit(100);

      if (error) {
        chatBoxEl.innerHTML = '<div class="muted">Ошибка загрузки чата</div>';
        console.error(error);
        return;
      }

      chatMessages = data || [];
      renderMessages();
    }

    function renderMessages() {
      if (!chatMessages.length) {
        chatBoxEl.innerHTML = '<div class="muted">Пока нет сообщений.</div>';
        return;
      }

      chatBoxEl.innerHTML = chatMessages.map(msg => `
        <div class="chat-line"><strong>${escapeHtml(msg.username)}:</strong> ${escapeHtml(msg.text)}</div>
      `).join('');

      chatBoxEl.scrollTop = chatBoxEl.scrollHeight;
    }

    async function sendMessage(text) {
      const clean = text.trim();
      if (!clean || !me || !myProfile) return;

      const { error } = await supabase
        .from('messages')
        .insert({
          user_id: me.id,
          username: myProfile.username || buildUsername(me),
          text: clean
        });

      if (error) {
        alert('Ошибка отправки сообщения: ' + error.message);
        console.error(error);
        return;
      }

      chatInputEl.value = '';
      await fetchMessages();
    }

    async function setStatus(status, color) {
      if (!me) return;

      const { error } = await supabase
        .from('profiles')
        .update({
          status,
          color,
          last_seen: new Date().toISOString(),
          status_changed_at: new Date().toISOString()
        })
        .eq('id', me.id);

      if (error) {
        alert('Ошибка обновления статуса: ' + error.message);
        console.error(error);
        return;
      }

      closeMenu();
      await fetchMyProfile();
      await fetchGroup();
    }

    async function endSession() {
      await setStatus('⛔ Сессия завершена', '#e53345');
    }

    async function heartbeat() {
      if (!me) return;

      await supabase
        .from('profiles')
        .update({ last_seen: new Date().toISOString() })
        .eq('id', me.id);
    }

    function tick() {
      if (myProfile?.status === '📚 Учусь') {
        bigTimerTextEl.textContent = formatBigTimer(myProfile.status_changed_at);
      }
      renderGroup();
    }

    googleBtn.addEventListener('click', signInWithGoogle);
    logoutBtnEl.addEventListener('click', signOut);
    endSessionBtnEl.addEventListener('click', endSession);
    statusMenuBtnEl.addEventListener('click', openMenu);
    closeMenuBtn.addEventListener('click', closeMenu);

    statusMenuEl.addEventListener('click', (e) => {
      if (e.target === statusMenuEl) closeMenu();
    });

    document.querySelectorAll('.status-option[data-status]').forEach(btn => {
      btn.addEventListener('click', async () => {
        await setStatus(btn.dataset.status, btn.dataset.color);
      });
    });

    chatFormEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      await sendMessage(chatInputEl.value);
    });

    async function init() {
      try {
        me = await getCurrentUser();

        if (!me) {
          setView('auth');
          return;
        }

        setView('app');

        await ensureProfile(me);
        await fetchMyProfile();
        await fetchGroup();
        await fetchMessages();
        await heartbeat();

        setInterval(heartbeat, 20000);
        setInterval(fetchGroup, 5000);
        setInterval(fetchMessages, 5000);
        setInterval(tick, 1000);
      } catch (e) {
        console.error('INIT ERROR', e);
        alert('Ошибка инициализации: ' + (e?.message || 'unknown'));
      }
    }

    init();
  </script>
</body>
</html>
